run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - gofmt
    - goimports
    - bodyclose
    - misspell
    - unconvert
    - unparam

linters-settings:
  errcheck:
    exclude-functions:
      - (net/http.ResponseWriter).Write

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - unparam
  max-issues-per-linter: 0
  max-same-issues: 0
